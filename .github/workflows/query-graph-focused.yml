name: Query Graph Focused

on:
  pull_request:
    paths:
      - "research/**"
      - "hermes_state_common.py"
      - "hermes_state_schema.py"
      - "tests/test_query_graph*.py"
      - "tests/test_evidence_fabric*.py"
      - ".github/workflows/query-graph-focused.yml"

permissions:
  contents: read

concurrency:
  group: query-graph-focused-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        uses: ./.github/actions/retry
        with:
          command: uv python install 3.11

      - name: Install dependencies
        uses: ./.github/actions/retry
        with:
          command: uv sync --locked --python 3.11 --extra all --extra dev --extra anthropic --extra mistral --extra fal --extra modal --extra daytona --extra hindsight --extra parallel-web

      - name: Run focused Query Graph tests
        run: |
          source .venv/bin/activate
          python -m pytest \
            tests/test_query_graph.py \
            tests/test_query_graph_schema.py \
            tests/test_evidence_fabric.py \
            tests/test_evidence_fabric_schema.py -q
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""
