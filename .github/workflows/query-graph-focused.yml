name: Query Graph Final Verification

on:
  pull_request:
    paths:
      - "research/**"
      - "hermes_state_common.py"
      - "hermes_state_schema.py"
      - "tests/test_query_graph*.py"
      - "tests/test_evidence_fabric*.py"
      - "tests/test_hermes_state*.py"
      - "tests/test_session_db*.py"
      - ".github/workflows/query-graph-focused.yml"

permissions:
  contents: read

concurrency:
  group: query-graph-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # 8.2.0
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Set up Python 3.11
        uses: ./.github/actions/retry
        with:
          command: uv python install 3.11

      - name: Install dependencies
        uses: ./.github/actions/retry
        with:
          command: uv sync --locked --python 3.11 --extra all --extra dev --extra anthropic --extra mistral --extra fal --extra modal --extra daytona --extra hindsight --extra parallel-web

      - name: Query Graph and Evidence Fabric suites
        run: |
          source .venv/bin/activate
          python -m pytest \
            tests/test_query_graph*.py \
            tests/test_evidence_fabric.py \
            tests/test_evidence_fabric_schema.py \
            tests/test_evidence_fabric_concurrency.py -q
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""

      - name: SessionDB and state regressions
        run: |
          source .venv/bin/activate
          python -m pytest \
            tests/test_hermes_state.py \
            tests/test_hermes_state_wal_fallback.py \
            tests/test_session_db_context_manager.py \
            tests/test_session_db_read_conn_pool.py -q

      - name: Compile verification
        run: |
          source .venv/bin/activate
          python -m compileall hermes_state_common.py hermes_state_schema.py research

      - name: Diff integrity and scope
        run: |
          git fetch origin design/query-graph-v1 --depth=1
          BASE=$(git rev-parse FETCH_HEAD)
          echo "Base: $BASE"
          echo "Head: $(git rev-parse HEAD)"
          git diff --check "$BASE"...HEAD
          echo "Changed paths:"
          git diff --name-only "$BASE"...HEAD
          python - <<'PY'
          import subprocess
          allowed_prefixes = (
              ".github/workflows/query-graph-focused.yml",
              "docs/superpowers/plans/2026-08-17-query-graph-v1",
              "hermes_state_common.py",
              "research/",
              "tests/state/test_session_git_metadata_generation.py",
              "tests/test_query_graph",
              "tests/test_evidence_fabric",
              "tests/test_hermes_state",
              "tests/test_session_db",
          )
          base = subprocess.check_output(
              ["git", "rev-parse", "FETCH_HEAD"], text=True
          ).strip()
          changed = subprocess.check_output(
              ["git", "diff", "--name-only", f"{base}...HEAD"], text=True
          ).splitlines()
          unexpected = [
              path for path in changed
              if not any(path.startswith(prefix) for prefix in allowed_prefixes)
          ]
          if unexpected:
              raise SystemExit(f"Unexpected Query Graph scope drift: {unexpected}")
          print(f"Scope check passed for {len(changed)} changed paths")
          PY

      - name: Prohibited drift scan
        run: |
          python - <<'PY'
          from pathlib import Path

          files = sorted(Path("research").glob("query_graph*.py"))
          text = "\n".join(path.read_text(encoding="utf-8") for path in files)
          prohibited = {
              "embedding/fuzzy dedup": ("embedding", "fuzzy"),
              "confidence/trust scoring": ("trust_score", "confidence_score"),
              "scheduler/model routing": ("model_router", "scheduler"),
              "external knowledge integrations": ("notebooklm", "obsidian", "knowledge_hub"),
              "automatic run terminalization": ("transition_research_run(",),
          }
          hits = []
          lowered = text.lower()
          for label, needles in prohibited.items():
              for needle in needles:
                  if needle.lower() in lowered:
                      hits.append((label, needle))
          if Path("tools/query_graph_tool.py").exists():
              hits.append(("model-facing tool", "tools/query_graph_tool.py"))
          if hits:
              raise SystemExit(f"Prohibited Query Graph drift found: {hits}")
          print(f"Prohibited drift scan passed across {len(files)} Query Graph modules")
          PY

      - name: Model-tool deferral boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          assert not Path("tools/query_graph_tool.py").exists()
          toolsets = Path("toolsets.py").read_text(encoding="utf-8")
          assert '"query_graph"' not in toolsets
          print("MODEL_TOOL_DEFERRED: no trusted model-facing Query Graph registration")
          PY
